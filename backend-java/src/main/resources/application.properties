# Server Configuration
server.port=3001
server.servlet.context-path=/api/v1

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# GitHub OAuth Configuration (read from environment variables)
github.oauth.client-id=${GITHUB_CLIENT_ID:Ov23libAaRFy9ZQibESK}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:c1173712b82d8988c764d33c33fcc0bbbf28d370}
github.oauth.redirect-uri=http://localhost:3001/api/v1/auth/github/callback
github.oauth.scopes=read:user,user:email,repo
github.oauth.frontend-url=http://localhost:3000

# Disable Spring Security's built-in OAuth2 auto-config (we handle it manually)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# MCP Configuration
mcp.host.url=${MCP_HOST_URL:http://localhost:8080}

# Logging
logging.level.com.sdlc=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
